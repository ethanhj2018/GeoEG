# GeoEG runtime config. API keys go in .env (see .env.example), never here.
MODE: local            # local: local vLLM; hybrid: cloud OpenAI-compatible API (needs the keys in .env)
output_language: en    # en | zh: language of clue descriptions, conclusions, summary, explanations and OCR clue text (detection prompts are always English)

vlm:
  local:
    base_url: http://127.0.0.1:8001/v1     # server started by scripts/start_vllm.sh
    model: qwen2.5-vl-7b-awq
  hybrid:                                   # all three are read from .env
    base_url_env: GEOEG_API_BASE
    model_env: GEOEG_API_MODEL
    api_key_env: GEOEG_API_KEY
  max_side: 1280         # resize the long side to this many pixels before sending to the VLM (vLLM also caps max_pixels=1003520)
  max_tokens: 1800
  timeout_s: 300

models:
  gdino: IDEA-Research/grounding-dino-base
  gdino_box_threshold: 0.30
  gdino_text_threshold: 0.25
  sam2: facebook/sam2.1-hiera-small
  g3_repo: ~/geoeg_refs/G3                  # imported only, code not copied
  g3_ckpt: ~/geoeg_refs/checkpoints/g3.pth

ocr:
  conda: ~/miniconda3/bin/conda
  env: geoeg-ocrtest                        # PaddleOCR lives only in this env; paddle is not installed in geoeg
  det_model: PP-OCRv6_medium_det
  rec_model: PP-OCRv6_medium_rec
  min_score: 0.8
  timeout_s: 180
  persistent: true       # persistent worker: only the first image pays the ~7 s startup; exits after idle_exit_s seconds idle, freeing ~0.8 GB VRAM
  idle_exit_s: 600

gpu:
  budget_mib: 14336      # whole-card VRAM budget (including vLLM); exceeding it logs a warning

switches:
  detect: true
  segment: true
  ocr: true
  geocode: true          # Nominatim (rate-limited + cached)
  driving_side: true     # geo-sleuth clues.py left/right driving country table (offline)
  overpass: false        # OSM Overpass verification, off by default; rate-limited + cached when on
  geoclip: true
  g3: true
  contradict_edges: true
  name_results: true     # reverse-geocode the output Top-5 with Nominatim for place names (turn off for batch evaluation to save time)

# Decision layer (conclude/decide.py): the VLM direct prediction is the anchor, overridden only by clear contrary evidence, then refined locally.
# params come from a grid search by eval/run_eval.py on the IM2GPS3K dev split (100 images); see eval/results/tuned_params.json.
decision:
  place_min_importance: 0.35   # minimum Nominatim importance for a place name in text to count as evidence
  params:
    place_decisive: 4.0
    override_min_contra: .inf
    retrieval_margin: 0.5
    retrieval_max_km: .inf
    w_g3: 0.5
    w_gc: 0.5
    w_sup: 1.0
    w_con: 1.0
    w_prox: 0.5
    refine_radius_km: 200.0
    refine_alpha: 0.5
    refine_dist_penalty: 0.0
    refine_min_gain: 0.0
    refine_skip_high: false

geocode:
  endpoint: https://nominatim.openstreetmap.org
  user_agent: GeoEG-research-prototype/0.1
  contact_env: GEOEG_CONTACT_EMAIL         # optional; added as the email parameter of Nominatim requests
  min_interval_s: 1.1                      # Nominatim policy: at most 1 request/s

overpass:
  min_interval_s: 5.0

candidates:
  geoclip_top_k: 20
  vlm_top_k: 5
  merge_km: 25
  rescore_top_n: 10      # number of candidates re-checked with reverse geocoding + country-level clues
  output_top_k: 5

scoring:                 # used only by the legacy pipeline (legacy_v1/, eval method c)
  w_clues: 1.0          # Σ weight × confidence × inside clue region
  w_contradict: 0.5      # contradiction penalty (candidate outside a clue region)
  w_g3: 2.0              # G3 similarity (min-max normalised across candidates)
  w_geoclip: 2.0         # GeoCLIP similarity (same)
  w_vlm: 1.0             # prior for candidates given directly by the VLM

paths:
  runs: runs
  cache: .cache/geoeg_cache.sqlite
  geosleuth_cache: .cache/geosleuth
